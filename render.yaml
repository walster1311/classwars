services:
  - type: web
    name: classverse-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:shared && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
